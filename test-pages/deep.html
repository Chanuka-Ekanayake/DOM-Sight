<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DOM Tracker — deep nesting test page</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; }
    .box { border-left: 2px solid #cbd; padding-left: 4px; }
    button { padding: 6px 12px; margin-right: 8px; }
  </style>
</head>
<body>
  <h1>Deep nesting test page</h1>
  <p>Trips the <em>max depth</em> budget (32) without many nodes.</p>
  <button data-depth="20">Nest 20</button>
  <button data-depth="40">Nest 40</button>
  <button data-depth="80">Nest 80</button>
  <button id="clear">Clear</button>
  <div id="root"></div>
  <script>
    const root = document.getElementById('root');
    document.querySelectorAll('button[data-depth]').forEach((b) => b.addEventListener('click', () => {
      let cur = root;
      for (let i = 0; i < Number(b.dataset.depth); i++) {
        const d = document.createElement('div');
        d.className = 'box';
        d.textContent = `level ${i + 1}`;
        cur.append(d);
        cur = d;
      }
    }));
    document.getElementById('clear').addEventListener('click', () => root.replaceChildren());
  </script>
</body>
</html>
