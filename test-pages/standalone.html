<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DOM Tracker — standalone HUD demo</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    button { padding: 6px 12px; }
    table { border-collapse: collapse; font-size: 12px; }
    td, th { border: 1px solid #ddd; padding: 2px 6px; white-space: nowrap; }
  </style>
</head>
<body>
  <h1>Standalone HUD demo</h1>
  <p>Runs <code>dist/content.js</code> with an in-memory <code>chrome.*</code> shim — no extension install needed. Run <code>npm run build</code> first.</p>
  <div class="toolbar">
    <button data-rows="100">+100 rows</button>
    <button data-rows="1000">+1,000 rows</button>
    <button data-rows="10000">+10,000 rows</button>
    <button id="clear">Clear</button>
    <button id="deep">Nest 40 deep</button>
  </div>
  <div id="grid"><table><tbody id="rows"></tbody></table></div>
  <div id="root"></div>
  <script src="./chrome-shim.js"></script>
  <script src="../dist/content.js"></script>
  <script>
    const tbody = document.getElementById('rows');
    let n = 0;
    document.querySelectorAll('button[data-rows]').forEach((b) => b.addEventListener('click', () => {
      const frag = document.createDocumentFragment();
      for (let i = 0; i < Number(b.dataset.rows); i++) {
        n++;
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${n}</td><td>Employee ${n}</td><td>Dept</td><td>Annual</td><td>2026-01-01</td><td>3</td>`;
        frag.append(tr);
      }
      tbody.append(frag);
    }));
    document.getElementById('clear').addEventListener('click', () => { tbody.replaceChildren(); n = 0; });
    document.getElementById('deep').addEventListener('click', () => {
      let cur = document.getElementById('root');
      for (let i = 0; i < 40; i++) { const d = document.createElement('div'); d.textContent = 'level ' + (i + 1); cur.append(d); cur = d; }
    });
  </script>
</body>
</html>
